<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Dashboard - REST API</title>
  <style>
    :root {
      --matcha: #78966b;
      --matcha-dark: #536f4b;
      --matcha-soft: #e8efe2;
      --cream: #f7f8f2;
      --white: #ffffff;
      --text: #344235;
      --muted: #829080;
      --border: #e5eadf;
      --shadow: 0 12px 32px rgba(66, 88, 59, 0.09);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(135deg, #f5f7ef 0%, #e8efe2 52%, #f8f9f5 100%);
      min-height: 100vh; padding: 34px 20px; color: var(--text);
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 {
      color: var(--matcha-dark); text-align: center; margin-bottom: 25px;
      font-size: 30px; font-weight: 700; letter-spacing: .2px;
    }
    .cards {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px; margin-bottom: 25px;
    }
    .card, .panel {
      background: rgba(255,255,255,.94); border: 1px solid rgba(220,230,213,.9);
      border-radius: 20px; padding: 25px; box-shadow: var(--shadow);
    }
    .card { text-align: center; transition: transform .22s ease, box-shadow .22s ease; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px rgba(66,88,59,.13); }
    .card .label {
      font-size: 13px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 1.3px; font-weight: 650;
    }
    .card .value { font-size: 42px; font-weight: 750; margin: 12px 0 7px; color: var(--matcha-dark); }
    .card .unit { font-size: 16px; color: #9aa596; }
    .status-badge {
      display: inline-block; padding: 7px 15px; border-radius: 30px;
      font-size: 13px; font-weight: 700; letter-spacing: .7px;
    }
    .status-online { background: #e2f0df; color: #477343; }
    .status-offline { background: #f7e9e5; color: #a65e50; }
    .panel { margin-bottom: 22px; }
    .panel h2 { font-size: 17px; margin-bottom: 18px; color: var(--matcha-dark); font-weight: 700; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .btn {
      padding: 12px 22px; border: none; border-radius: 12px; font-size: 14px;
      font-weight: 650; cursor: pointer; transition: all .2s ease;
    }
    .btn-on { background: var(--matcha); color: white; }
    .btn-on:hover { background: var(--matcha-dark); transform: translateY(-1px); }
    .btn-off { background: #f0e5e1; color: #9b5e51; }
    .btn-off:hover { background: #e8d5ce; transform: translateY(-1px); }
    input[type="number"] {
      background: #fbfcf9; border: 1px solid #dce5d6 !important;
      border-radius: 12px !important; color: var(--text); outline: none;
    }
    input[type="number"]:focus { border-color: var(--matcha) !important; box-shadow: 0 0 0 3px rgba(120,150,107,.13); }
    #info-batas { color: var(--muted) !important; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; overflow: hidden; }
    th, td { padding: 13px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: #f1f5ed; color: #687c61; text-transform: uppercase; font-size: 11px; letter-spacing: .8px; }
    tr:hover td { background: #f8faf5; }
    #log {
      background: #28372b; color: #dcebd5; font-family: monospace; padding: 16px;
      border-radius: 13px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.7;
    }
    #log .error { color: #ffb6a8; }
    #log .info { color: #c1e2ad; }
    #mode-info { color: #75866f !important; }
    #alert-box { background: #a85f4f !important; border-radius: 13px !important; }
    @media (max-width: 600px) {
      body { padding: 24px 14px; }
      h1 { font-size: 23px; }
      .card, .panel { padding: 20px; border-radius: 17px; }
      .controls { gap: 10px; }
      .btn { flex: 1 1 auto; }
      table { min-width: 430px; }
      .panel:has(table) { overflow-x: auto; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🌡️ IoT Dashboard — REST API + WebSocket</h1>
  <div id="mode-info" style="text-align:center; margin:-15px 0 20px; font-size:14px;">Mode: menghubungkan...</div>
  <div id="alert-box" style="display:none; color:white; padding:15px 20px; margin-bottom:20px; font-weight:600; text-align:center;"></div>
  <div class="cards">
    <div class="card">
      <div class="label">Suhu</div>
      <div class="value" id="suhu">--</div>
      <div class="unit">°C</div>
    </div>
    <div class="card">
      <div class="label">Kelembaban</div>
      <div class="value" id="kelembaban">--</div>
      <div class="unit">%</div>
    </div>
    <div class="card">
      <div class="label">Status Sensor</div>
      <div class="value" style="font-size:22px;">
        <span class="status-badge status-offline" id="status-badge">OFFLINE</span>
      </div>
    </div>
  </div>
  <div class="panel">
  <h2>🌡️ Batas Suhu (Threshold)</h2>
  <div class="controls">
    <input type="number" id="input-batas" step="0.1" placeholder="Contoh: 30"
           style="padding:12px; border:1px solid #dce5d6; border-radius:12px; font-size:15px; width:160px;">
    <button class="btn btn-on" onclick="setBatas()">Simpan Batas</button>
    <span id="info-batas" style="align-self:center; color:#666;">Batas saat ini: --</span>
  </div>
</div>
  <div class="panel">
    <h2>💡 Kontrol Perangkat</h2>
    <div class="controls">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
    </div>
  </div>

 <div class="panel">
  <h2>📈 Grafik Suhu & Kelembaban</h2>
  <canvas id="grafik" height="110"></canvas>
</div>

<div class="panel">
  <h2>📋 10 Data Sensor Terakhir</h2>
  <table>
    <thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
    <tbody id="history-body">
      <tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr>
    </tbody>
  </table>
</div>

  <div class="panel">
    <h2>📝 Log Aktivitas</h2>
    <div id="log"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
// Jika dibuka lewat http://localhost:1880/dashboard.html -> pakai '/api' dan host yang sama
// Jika dibuka langsung dari file (file://) -> pakai alamat lengkap
const API_BASE = location.protocol === 'file:' ? 'http://localhost:1880/api' : '/api';
const WS_URL = location.protocol === 'file:'
  ? 'ws://localhost:1880/ws/sensor'
  : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/sensor';
const API_KEY = 'iot-kampus-2026';

let sedangAlert = false;
let wsAktif = false;        // true selama WebSocket tersambung
let riwayat = [];           // history lokal (maks 50 data)
let terakhirMasuk = null;   // waktu data sensor terakhir (ms)

function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  el.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function setBadge(online) {
  const badge = document.getElementById('status-badge');
  badge.textContent = online ? 'ONLINE' : 'OFFLINE';
  badge.className = 'status-badge ' + (online ? 'status-online' : 'status-offline');
}

function setMode(teks) {
  document.getElementById('mode-info').textContent = 'Mode: ' + teks;
}

// ==============================
// TAMPILKAN DATA SENSOR (dipakai WebSocket maupun polling)
// ==============================
function tampilkanSensor(d) {
  document.getElementById('suhu').textContent = d.suhu;
  document.getElementById('kelembaban').textContent = d.kelembaban;
  terakhirMasuk = new Date(d.received).getTime();
  setBadge(Date.now() - terakhirMasuk < 10000);

  document.getElementById('info-batas').textContent = 'Batas saat ini: ' + d.batas + ' °C';
  const box = document.getElementById('alert-box');
  if (d.melewati_batas) {
    box.style.display = 'block';
    box.textContent = `⚠️ PERINGATAN: Suhu ${d.suhu} °C melewati batas ${d.batas} °C!`;
    if (!sedangAlert) {
      log(`⚠️ Suhu ${d.suhu} °C melewati batas ${d.batas} °C`, 'error');
      sedangAlert = true;
    }
  } else {
    box.style.display = 'none';
    sedangAlert = false;
  }
}

// ==============================
// GRAFIK + TABEL (dirender dari array riwayat)
// ==============================
const grafik = new Chart(document.getElementById('grafik'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Suhu (°C)', data: [], borderColor: '#829d70', backgroundColor: 'rgba(130,157,112,.12)', tension: 0.35, fill: true },
      { label: 'Kelembaban (%)', data: [], borderColor: '#b6c9a7', backgroundColor: 'rgba(182,201,167,.10)', tension: 0.35, fill: true }
    ]
  },
  options: { animation: false, responsive: true, plugins: { legend: { labels: { color: '#687c61', usePointStyle: true, boxWidth: 8 } } }, scales: { x: { ticks: { color: '#829080' }, grid: { color: '#edf1e9' } }, y: { ticks: { color: '#829080' }, grid: { color: '#edf1e9' } } } }
});

function renderRiwayat() {
  const d20 = riwayat.slice(-20);
  grafik.data.labels = d20.map(x => new Date(x.received).toLocaleTimeString());
  grafik.data.datasets[0].data = d20.map(x => x.suhu);
  grafik.data.datasets[1].data = d20.map(x => x.kelembaban);
  grafik.update();

  const tbody = document.getElementById('history-body');
  if (riwayat.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
    return;
  }
  tbody.innerHTML = riwayat.slice(-10).reverse().map(d => `
    <tr>
      <td>${new Date(d.received).toLocaleTimeString()}</td>
      <td>${d.suhu}</td>
      <td>${d.kelembaban}</td>
    </tr>`).join('');
}

// ==============================
// REST: dipakai sekali di awal, dan sebagai cadangan kalau WebSocket putus
// ==============================
async function fetchSensor() {
  try {
    const res = await fetch(`${API_BASE}/suhu`, { headers: { 'X-API-Key': API_KEY } });
    const json = await res.json();
    if (json.status === 'success' && json.data.suhu !== null) {
      tampilkanSensor(json.data);
    } else {
      setBadge(false);
    }
  } catch (err) {
    setBadge(false);
    log(`Gagal fetch sensor: ${err.message}`, 'error');
  }
}

async function fetchHistory() {
  try {
    const res = await fetch(`${API_BASE}/history`, { headers: { 'X-API-Key': API_KEY } });
    const json = await res.json();
    riwayat = json.data || [];
    renderRiwayat();
  } catch (err) {
    log(`Gagal fetch history: ${err.message}`, 'error');
  }
}

// ==============================
// WEBSOCKET: update tanpa polling
// ==============================
let socketAktif = null;     // referensi socket yang sedang dipakai
let terakhirPesanWS = 0;    // waktu pesan WebSocket terakhir (ms)

function sambungWebSocket() {
  let ws;
  try {
    ws = new WebSocket(WS_URL);
  } catch (err) {
    log(`✗ WebSocket gagal dibuat: ${err.message}`, 'error');
    setTimeout(sambungWebSocket, 3000);
    return;
  }
  socketAktif = ws;

  ws.onopen = () => {
    wsAktif = true;
    terakhirPesanWS = Date.now();
    setMode('WebSocket (real-time, tanpa polling)');
    log('✓ WebSocket tersambung', 'info');
    fetchSensor();    // sinkronkan sekali
    fetchHistory();
  };

  ws.onmessage = (event) => {
    terakhirPesanWS = Date.now();
    try {
      const pesan = JSON.parse(event.data);
      if (pesan.type === 'sensor' && pesan.data) {
        tampilkanSensor(pesan.data);
        riwayat.push(pesan.data);
        if (riwayat.length > 50) riwayat.shift();
        renderRiwayat();
      }
    } catch (err) {
      log(`✗ Pesan WebSocket tidak valid: ${err.message}`, 'error');
    }
  };

  ws.onclose = (e) => {
    if (ws !== socketAktif) return;      // abaikan socket lama
    if (wsAktif) log(`WebSocket terputus (kode ${e.code}), beralih ke polling dan mencoba tersambung lagi...`, 'error');
    wsAktif = false;
    setMode('Polling REST (WebSocket terputus)');
    setTimeout(sambungWebSocket, 3000);
  };

  ws.onerror = () => { ws.close(); };
}

// Watchdog: kalau WebSocket "tersambung" tapi tidak ada data > 8 detik, sambungkan ulang
setInterval(() => {
  if (wsAktif && socketAktif && Date.now() - terakhirPesanWS > 8000) {
    log('⚠️ WebSocket diam > 8 detik, menyambung ulang...', 'error');
    socketAktif.close();
  }
}, 2000);

// ==============================
// AKSI: threshold dan kontrol (tetap lewat REST)
// ==============================
async function setBatas() {
  const nilai = parseFloat(document.getElementById('input-batas').value);
  if (isNaN(nilai)) { log('✗ Batas harus berupa angka', 'error'); return; }
  try {
    const res = await fetch(`${API_BASE}/threshold`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
      body: JSON.stringify({ batas: nilai })
    });
    const json = await res.json();
    if (json.status === 'success') log(`✓ Batas suhu diubah ke ${json.batas} °C`, 'info');
    else log(`✗ Gagal: ${json.message}`, 'error');
  } catch (err) {
    log(`✗ Error threshold: ${err.message}`, 'error');
  }
}

async function kontrol(device, action) {
  try {
    const res = await fetch(`${API_BASE}/kontrol`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
      body: JSON.stringify({ device, action })
    });
    const json = await res.json();
    if (json.status === 'success') {
      log(`✓ Perintah terkirim: ${device} → ${action}`, 'info');
    } else {
      log(`✗ Gagal: ${json.message}`, 'error');
    }
  } catch (err) {
    log(`✗ Error kontrol: ${err.message}`, 'error');
  }
}

// ==============================
// MULAI
// ==============================
log('Dashboard dimulai, menghubungkan WebSocket...');
fetchSensor();
fetchHistory();
sambungWebSocket();

// Cadangan: polling hanya berjalan selama WebSocket TIDAK tersambung
setInterval(() => {
  if (!wsAktif) { fetchSensor(); fetchHistory(); }
}, 3000);

// Badge menjadi OFFLINE kalau tidak ada data baru > 10 detik
setInterval(() => {
  if (terakhirMasuk !== null) setBadge(Date.now() - terakhirMasuk < 10000);
}, 2000);
</script>
</body>
</html>
